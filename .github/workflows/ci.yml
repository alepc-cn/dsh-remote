name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: privacy-check
        run: node scripts/privacy-check.mjs
      - name: syntax-check
        run: |
          node --check lib/index.js
          node --check lib/client.js
          node --check selftest.mjs
          node --check selftest-client.mjs
      - name: selftest
        run: node selftest.mjs
      - name: selftest-client
        run: node selftest-client.mjs