name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: privacy-check
        run: node scripts/privacy-check.mjs
      - name: syntax-check
        run: |
          node --check lib/index.js
          node --check lib/client.js
          node --check lib/shim.js
          node --check lib/logging.js
          node --check lib/util.js
          node --check lib/live.js
          node --check lib/reach.js
          node --check lib/devices.js
          node --check lib/data.js
          node --check lib/attach.js
          node --check lib/proxy.js
          node --check lib/edge.js
          node --check lib/auth.js
          node --check lib/notice.js
          node --check selftest.mjs
          node --check selftest-client.mjs
      - name: selftest
        run: node selftest.mjs
      - name: selftest-client
        run: node selftest-client.mjs
      - name: e2e
        run: node e2e.mjs